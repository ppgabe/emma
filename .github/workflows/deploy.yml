name: Deploy Backend (Native)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/emma-server

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'backend/pom.xml'

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

      - name: Install and configure the Koyeb CLI
        uses: koyeb-community/koyeb-actions@v2
        with:
          api_token: "${{ secrets.KOYEB_API_TOKEN }}"

      - name: Add Koyeb datasource URL secret
        uses: koyeb/action-git-deploy/secret@v1
        with:
          secret-name: SPRING_DATASOURCE_URL
          secret-value: "${{ secrets.SPRING_DATASOURCE_URL }}"

      - name: Add Koyeb datasource Username secret
        uses: koyeb/action-git-deploy/secret@v1
        with:
          secret-name: SPRING_DATASOURCE_USERNAME
          secret-value: "${{ secrets.SPRING_DATASOURCE_USERNAME }}"

      - name: Add Koyeb datasource Password secret
        uses: koyeb/action-git-deploy/secret@v1
        with:
          secret-name: SPRING_DATASOURCE_PASSWORD
          secret-value: "${{ secrets.SPRING_DATASOURCE_PASSWORD }}"
          
      - name: Deploy via Koyeb CLI
        uses: koyeb/action-git-deploy@v1
        with:
          app-name: emma
          service-name: emma-server
          docker: ${{ env.IMAGE_NAME }}:latest
